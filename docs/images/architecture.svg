<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="840" viewBox="0 0 1700 840"><defs><filter id="soft" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1E293B" flood-opacity="0.13"/></filter><linearGradient id="fuse" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#4338CA"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#6366F1"/></marker><marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#10B981"/></marker><marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#94A3B8"/></marker></defs><rect width="1700" height="840" fill="#FBFCFE"/><text x="60" y="64" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="34" fill="#0F172A" font-weight="800" text-anchor="start">gemma4-swe-kit</text><text x="62" y="92" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="16" fill="#64748B" font-weight="500" text-anchor="start">Local evaluation for Gemma 4 SWE agents that behaves like the Kaggle scorer's vLLM front end</text><rect x="60" y="170" width="300" height="230" rx="14" ry="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#soft)"/><rect x="78" y="186" width="153" height="24" rx="12" fill="#E0E7FF"/><text x="87" y="203" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="12.5" fill="#4F46E5" font-weight="700" text-anchor="start">your submission</text><text x="78" y="236" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">Agent bundle</text><text x="78" y="264" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">ADK YAML agents and sub-agents</text><text x="78" y="287" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">prompts and skills</text><text x="78" y="310" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">PEFT LoRA adapters</text><text x="78" y="333" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">eval_config.yaml budget</text><rect x="420" y="170" width="320" height="230" rx="14" ry="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#soft)"/><rect x="438" y="186" width="171" height="24" rx="12" fill="#E0E7FF"/><text x="447" y="203" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="12.5" fill="#4F46E5" font-weight="700" text-anchor="start">g4kit-harness run</text><text x="438" y="236" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">Official harness</text><text x="438" y="264" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">swegemma + ADK runner</text><text x="438" y="287" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">compaction at 14,336 tokens</text><text x="438" y="310" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">tool results as JSON</text><text x="438" y="333" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">nudges on unparsed calls</text><rect x="800" y="150" width="440" height="270" rx="16" ry="16" fill="url(#fuse)" stroke="#4338CA" stroke-width="1.5" filter="url(#soft)"/><text x="824" y="190" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="24" fill="#FFFFFF" font-weight="800" text-anchor="start">g4kit-proxy</text><text x="824" y="214" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#C7D2FE" font-weight="500" text-anchor="start">OpenAI-compatible /v1/chat/completions</text><rect x="824" y="238" width="392" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.12"/><text x="840" y="259" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Chat template</text><text x="840" y="278" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="13" fill="#E0E7FF" font-weight="500" text-anchor="start">rendered like vLLM 0.19 (openai content format)</text><rect x="824" y="296" width="392" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.12"/><text x="840" y="317" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">gemma4 call parser</text><text x="840" y="336" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="13" fill="#E0E7FF" font-weight="500" text-anchor="start">vLLM 0.19.1 rules: malformed calls stay text</text><rect x="824" y="354" width="392" height="48" rx="10" fill="#FFFFFF" fill-opacity="0.12"/><text x="840" y="375" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Limits</text><text x="840" y="394" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="13" fill="#E0E7FF" font-weight="500" text-anchor="start">32,768-token context, thinking-token budget</text><rect x="1300" y="150" width="340" height="120" rx="14" ry="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#soft)"/><text x="1318" y="188" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">Ollama (raw mode)</text><text x="1318" y="216" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">any OS, template bypassed</text><rect x="1300" y="300" width="340" height="120" rx="14" ry="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#soft)"/><text x="1318" y="338" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">MLX (Apple silicon)</text><text x="1318" y="366" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">prefix KV cache, LoRA adapters</text><line x1="360" y1="285" x2="412" y2="285" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="740" y1="285" x2="792" y2="285" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1240" y1="210" x2="1292" y2="210" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrow)"/><line x1="1240" y1="360" x2="1292" y2="360" stroke="#4F46E5" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="800" y="470" width="440" height="56" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/><text x="820" y="504" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="15" fill="#0F172A" font-weight="600" text-anchor="start">Proxy logs: every request, completion and token count</text><line x1="1020" y1="420" x2="1020" y2="462" stroke="#94A3B8" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrowD)"/><rect x="60" y="640" width="375" height="122" rx="14" ry="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#soft)"/><text x="78" y="678" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">Distillation data</text><text x="78" y="706" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">convert-openhands, render-distill:</text><text x="78" y="729" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">windows in the harness format</text><rect x="465" y="640" width="375" height="122" rx="14" ry="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#soft)"/><text x="483" y="678" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">g4kit-fake-llm</text><text x="483" y="706" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">scripted model walks the bundle</text><text x="483" y="729" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">through the real harness, no GPU</text><rect x="870" y="640" width="375" height="122" rx="14" ry="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#soft)"/><text x="888" y="678" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">g4kit-scorer-time</text><text x="888" y="706" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">projects scorer hours for</text><text x="888" y="729" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">~120 tasks from local runs</text><rect x="1275" y="640" width="375" height="122" rx="14" ry="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="1.5" filter="url(#soft)"/><text x="1293" y="678" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="19" fill="#0F172A" font-weight="800" text-anchor="start">g4kit-replay / log-stats</text><text x="1293" y="706" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">re-sends logged decision points;</text><text x="1293" y="729" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">loops, failed edits, overflows</text><path d="M247 632 C247 520, 210 500, 210 408" fill="none" stroke="#047857" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrowG)"/><text x="262" y="560" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="13" fill="#047857" font-weight="600" text-anchor="start">trains LoRA adapters</text><path d="M652 632 C652 520, 580 500, 580 408" fill="none" stroke="#047857" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrowG)"/><text x="667" y="560" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="13" fill="#047857" font-weight="600" text-anchor="start">stands in for the model</text><path d="M1020 526 C1020 580, 1057 580, 1057 632" fill="none" stroke="#047857" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrowG)"/><path d="M1020 526 C1020 580, 1462 580, 1462 632" fill="none" stroke="#047857" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrowG)"/><text x="60" y="808" font-family="Geist, 'Helvetica Neue', 'Inter', Arial, sans-serif" font-size="14" fill="#64748B" font-weight="500" text-anchor="start">Ships no competition data, weights or chat template: the kit reads the user's own copies (g4kit-assets fetches and fingerprints them).</text></svg>
